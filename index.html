<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vineeth's Online Shopping System</title>
    <!-- Tailwind CSS CDN for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Link to your separate CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Initial Balance Prompt Modal -->
    <div id="balance-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl max-w-md w-full shadow-2xl text-center">
            <h2 class="text-2xl font-bold text-indigo-400 mb-2">🛍️ Welcome to Vineeth's Shop</h2>
            <p class="text-slate-300 text-sm mb-6">Please enter your starting virtual wallet balance before entering the store.</p>
            <div class="mb-6 text-left">
                <label class="block text-xs uppercase tracking-wider text-slate-400 font-semibold mb-2">Initial Wallet Balance (₹)</label>
                <input type="number" id="initial-balance-input" value="100000" class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-3 text-white font-semibold focus:outline-none focus:border-indigo-500" placeholder="e.g. 50000">
            </div>
            <button onclick="enterStore()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-3 rounded-lg transition shadow-lg">Enter Store</button>
        </div>
    </div>

    <!-- Header / Navbar -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide text-indigo-400">🛍️ Vineeth's Shop</h1>
            <div class="flex items-center space-x-6">
                <!-- User Wallet Balance -->
                <div class="bg-slate-700 px-4 py-2 rounded-lg border border-slate-600">
                    <span class="text-xs text-slate-400 block">Wallet Balance</span>
                    <span id="user-balance" class="text-lg font-semibold text-emerald-400">₹0.00</span>
                </div>
                <!-- Cart Button -->
                <button onclick="toggleCartModal()" class="relative bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg font-medium transition flex items-center space-x-2">
                    <span>🛒 Cart</span>
                    <span id="cart-badge" class="absolute -top-2 -right-2 bg-rose-500 text-white text-xs w-6 h-6 rounded-full flex items-center justify-center font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        <!-- Category Selection Tabs -->
        <div class="flex flex-wrap gap-3 mb-8">
            <button onclick="filterCategory('All')" class="cat-btn px-5 py-2 rounded-lg font-medium bg-indigo-600 text-white transition shadow">All Products</button>
            <button onclick="filterCategory('Clothes')" class="cat-btn px-5 py-2 rounded-lg font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Clothes</button>
            <button onclick="filterCategory('Foods')" class="cat-btn px-5 py-2 rounded-lg font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Foods</button>
            <button onclick="filterCategory('Electronics')" class="cat-btn px-5 py-2 rounded-lg font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Electronics</button>
            <button onclick="filterCategory('Stationery')" class="cat-btn px-5 py-2 rounded-lg font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition">Stationery</button>
        </div>

        <!-- Product Grid -->
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Dynamic products will be injected here -->
        </div>
    </main>

    <!-- Cart Slide-over / Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden z-50 flex justify-end">
        <div class="bg-slate-800 w-full max-w-md h-full p-6 flex flex-col shadow-2xl border-l border-slate-700">
            <div class="flex justify-between items-center pb-4 border-b border-slate-700">
                <h2 class="text-xl font-bold text-indigo-400">Your Shopping Cart</h2>
                <button onclick="toggleCartModal()" class="text-slate-400 hover:text-white text-2xl font-bold">&times;</button>
            </div>

            <!-- Cart Items List -->
            <div id="cart-items-container" class="flex-grow overflow-y-auto py-4 space-y-4">
                <p class="text-slate-400 text-center py-8">Your cart is empty.</p>
            </div>

            <!-- Cart Summary & Checkout -->
            <div class="pt-4 border-t border-slate-700 space-y-4">
                <div class="flex justify-between text-lg font-semibold">
                    <span>Total Amount:</span>
                    <span id="cart-total" class="text-emerald-400">₹0.00</span>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <button onclick="clearCart()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 py-2.5 rounded-lg font-medium transition">Clear Cart</button>
                    <button onclick="checkout()" class="bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-lg font-medium transition">Checkout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 border border-slate-600 text-slate-100 px-5 py-3 rounded-xl shadow-2xl transform translate-y-32 opacity-0 transition-all duration-300 z-50 flex items-center space-x-3">
        <span id="toast-icon">✅</span>
        <span id="toast-message" class="font-medium"></span>
    </div>

    <!-- Link to your separate JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
